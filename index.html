<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimrod1971 | Deep Sky Logbook</title>
    <!-- Google Fonts & Markdown Parser -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #070a12;
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-card-hover: rgba(30, 41, 59, 0.8);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(56, 189, 248, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-dark); 
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.05) 0px, transparent 50%);
            color: var(--text-light); 
            font-family: 'Inter', sans-serif; 
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Navigation */
        header { 
            border-bottom: 1px solid var(--border); 
            background: rgba(7, 10, 18, 0.8); 
            backdrop-filter: blur(12px); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .nav-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1.25rem 2rem; 
        }
        .logo { 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem; 
            font-weight: 700; 
            color: var(--text-light); 
            letter-spacing: 1px; 
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo span { color: var(--accent); }

        nav { display: flex; gap: 0.5rem; }
        nav button { 
            background: transparent; 
            border: 1px solid transparent; 
            color: var(--text-muted); 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem; 
            font-weight: 600; 
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        nav button.active, nav button:hover { 
            color: var(--accent); 
            background: var(--accent-glow);
            border-color: var(--border-hover);
        }

        /* Hauptbereich & Hero Header */
        main { max-width: 1200px; margin: 2.5rem auto; padding: 0 2rem; }

        .hero {
            margin-bottom: 3rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-muted); font-size: 1rem; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Grids & Cards */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 2rem; 
        }
        
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            background: var(--bg-card-hover);
        }

        .card-img-wrap {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
            background: #0f172a;
        }
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease;
        }
        .card:hover img { transform: scale(1.04); }

        .card-body { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        
        .card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-date {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border-color: var(--border);
        }

        .card-title { 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem; 
            font-weight: 700;
            margin-bottom: 0.75rem; 
            color: var(--text-light); 
        }
        .card-text { 
            font-size: 0.92rem; 
            color: var(--text-muted); 
            line-height: 1.6;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Artikel Reader View */
        .article-reader {
            display: none;
            max-width: 860px;
            margin: 0 auto;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--accent);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
        }

        .article-post {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(8px);
        }
        .article-post h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        .article-post h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            color: var(--accent);
            margin: 1.8rem 0 0.8rem 0;
        }
        .article-post p {
            margin-bottom: 1.2rem;
            font-size: 1rem;
            color: #cbd5e1;
            line-height: 1.8;
        }
        .article-post ul, .article-post ol {
            margin: 1rem 0 1.5rem 1.5rem;
            color: #cbd5e1;
        }
        .article-post li { margin-bottom: 0.4rem; }
        .article-post img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        /* Galerie Grid */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 1.25rem; 
        }
        .gallery-item { 
            position: relative; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
            cursor: pointer; 
            aspect-ratio: 1; 
            transition: all 0.3s ease;
        }
        .gallery-item:hover {
            border-color: var(--accent);
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Detail Modal für Beobachtungen */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 13, 0.85);
            backdrop-filter: blur(12px);
            z-index: 500;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-y: auto;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid var(--border-hover);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px var(--accent-glow);
        }
        .close-modal {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-light);
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .close-modal:hover { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

        .modal-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .modal-meta-item strong { color: var(--accent); display: block; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.2rem; }

        .modal-photos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .modal-photo-thumb {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal-photo-thumb:hover { border-color: var(--accent); transform: scale(1.03); }
        .modal-photo-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* Lightbox Overlay */
        .lightbox { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(4, 7, 13, 0.95); 
            backdrop-filter: blur(12px);
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 2rem; 
        }
        .lightbox img { 
            max-width: 95vw; 
            max-height: 90vh; 
            border-radius: 12px; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border: 1px solid var(--border);
            object-fit: contain;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><span>✦</span> NIMROD1971 | ASTRO LOG</div>
            <nav>
                <button class="active" onclick="switchTab('blog', this)">Beobachtungen</button>
                <button onclick="switchTab('articles', this)">Artikel</button>
                <button onclick="switchTab('gallery', this)">Galerie</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1 id="tab-title">Beobachtungstagebuch</h1>
            <p id="tab-desc">Dokumentierte Nächte, Aufnahmen und astronomische Notizen.</p>
        </div>

        <section id="blog" class="tab-content active">
            <div id="blog-grid" class="grid">Lade Beobachtungen...</div>
        </section>

        <section id="articles" class="tab-content">
            <div id="article-grid" class="grid">Lade Artikel...</div>
            <div id="article-reader" class="article-reader"></div>
        </section>

        <section id="gallery" class="tab-content">
            <div id="gallery-grid" class="gallery-grid">Lade Galerie...</div>
        </section>
    </main>

    <!-- Detail Modal für Beobachtungen -->
    <div id="observation-modal" class="modal" onclick="if(event.target === this) closeModal()">
        <div class="modal-content" id="modal-body">
            <!-- Dynamischer Inhalt -->
        </div>
    </div>

    <!-- Lightbox für Zoom & Vollbild -->
    <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="" alt="Vollbild / Zoom">
    </div>

    <script>
        let siteData = [];

        async function loadData() {
            try {
                const res = await fetch('data.json?v=' + new Date().getTime());
                siteData = await res.json();
                renderBlog();
                renderArticles();
                renderGallery();
            } catch (e) {
                document.getElementById('blog-grid').innerHTML = '<p style="color:var(--text-muted)">Noch keine Daten veröffentlicht.</p>';
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            const titleEl = document.getElementById('tab-title');
            const descEl = document.getElementById('tab-desc');
            
            if (tabId === 'blog') {
                titleEl.textContent = 'Beobachtungstagebuch';
                descEl.textContent = 'Dokumentierte Nächte, Aufnahmen und astronomische Notizen.';
            } else if (tabId === 'articles') {
                titleEl.textContent = 'Artikel & Berichte';
                descEl.textContent = 'Unboxing, Testberichte und Ausrüstungserfahrungen.';
                renderArticles();
            } else if (tabId === 'gallery') {
                titleEl.textContent = 'Astro-Fotogalerie';
                descEl.textContent = 'Alle gesammelten Aufnahmen im Überblick.';
            }
        }

        function renderBlog() {
            const container = document.getElementById('blog-grid');
            const obs = siteData
                .map((e, idx) => ({ ...e, originalIndex: idx }))
                .filter(e => !(e.obj_type && e.obj_type.toLowerCase().includes('artikel')));

            if (obs.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted)">Keine Beobachtungen vorhanden.</p>';
                return;
            }
            container.innerHTML = obs.map(e => createCardHTML(e)).join('');
        }

        function renderArticles() {
            const grid = document.getElementById('article-grid');
            const reader = document.getElementById('article-reader');
            
            reader.style.display = 'none';
            grid.style.display = 'grid';

            const articles = siteData
                .map((e, idx) => ({ ...e, originalIndex: idx }))
                .filter(e => e.obj_type && e.obj_type.toLowerCase().includes('artikel'));

            if (articles.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted)">Noch keine separaten Artikel vorhanden.</p>';
                return;
            }
            grid.innerHTML = articles.map(e => createArticleTeaserHTML(e)).join('');
        }

        function createCardHTML(e) {
            const hasImages = e.photos && e.photos.length > 0;
            const skyBortle = e.sky_quality ? `Bortle ${e.sky_quality}` : null;
            const previewImg = hasImages ? e.photos[0] : null;
            const imageCount = hasImages ? e.photos.length : 0;
            
            return `
                <article class="card" onclick="openObservationModal(${e.originalIndex})">
                    ${previewImg ? `
                        <div class="card-img-wrap">
                            <img src="${previewImg}" alt="${e.obj_name}" loading="lazy">
                            ${imageCount > 1 ? `<span style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.7); color:#fff; font-size:0.75rem; padding:2px 8px; border-radius:12px; border:1px solid rgba(255,255,255,0.2);">📷 ${imageCount} Fotos</span>` : ''}
                        </div>
                    ` : ''}
                    <div class="card-body">
                        <div class="card-badges">
                            <span class="badge badge-date">${e.date || 'Unbekannt'}</span>
                            ${e.obj_type ? `<span class="badge">${e.obj_type}</span>` : ''}
                            ${skyBortle ? `<span class="badge" style="border-color:rgba(129,140,248,0.3); color:#818cf8;">${skyBortle}</span>` : ''}
                        </div>
                        <h2 class="card-title">${e.obj_name}</h2>
                        <div class="card-text">${e.notes || e.obj_desc || 'Keine Notizen hinterlegt.'}</div>
                        <div style="margin-top:1rem; color:var(--accent); font-weight:600; font-size:0.85rem;">Details & Fotos ansehen →</div>
                    </div>
                </article>
            `;
        }

        function openObservationModal(idx) {
            const e = siteData[idx];
            const modal = document.getElementById('observation-modal');
            const body = document.getElementById('modal-body');

            const photosHTML = e.photos && e.photos.length > 0 ? `
                <h3 style="font-family:'Space Grotesk',sans-serif; color:var(--accent); margin-top:1.5rem; margin-bottom:0.75rem;">Gekoppelte Aufnahmen (${e.photos.length}/4)</h3>
                <div class="modal-photos">
                    ${e.photos.map(p => `
                        <div class="modal-photo-thumb" onclick="openLightbox('${p}')">
                            <img src="${p}" alt="Astroaufnahme" loading="lazy">
                        </div>
                    `).join('')}
                </div>
            ` : '';

            body.innerHTML = `
                <button class="close-modal" onclick="closeModal()">✕</button>
                <div class="card-badges" style="margin-bottom: 0.5rem;">
                    <span class="badge badge-date">${e.date || 'Unbekannt'} ${e.time ? '• ' + e.time : ''}</span>
                    ${e.obj_type ? `<span class="badge">${e.obj_type}</span>` : ''}
                </div>
                <h1 style="font-family:'Space Grotesk',sans-serif; font-size:1.8rem; margin-bottom:1rem; color:var(--text-light);">${e.obj_name}</h1>
                
                <div class="modal-meta-grid">
                    <div class="modal-meta-item"><strong>Beobachtungsort</strong>${e.location || 'Nicht angegeben'}</div>
                    <div class="modal-meta-item"><strong>Equipment</strong>${e.equipment || 'Nicht angegeben'}</div>
                    <div class="modal-meta-item"><strong>Himmel & Seeing</strong>Bortle ${e.sky_quality || '?'}, ${e.weather || 'Keine Angabe'}</div>
                </div>

                ${e.obj_desc ? `<div style="margin-bottom:1.2rem;"><strong style="color:var(--accent); display:block; margin-bottom:0.3rem;">Objekt-Info</strong><p style="color:#cbd5e1; font-size:0.95rem;">${e.obj_desc}</p></div>` : ''}
                
                ${e.notes ? `<div style="margin-bottom:1.2rem;"><strong style="color:var(--accent); display:block; margin-bottom:0.3rem;">Beobachtungsnotizen & Eindrücke</strong><p style="color:#cbd5e1; font-size:0.95rem; white-space: pre-line;">${e.notes}</p></div>` : ''}

                ${photosHTML}
            `;

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('observation-modal').style.display = 'none';
        }

        function createArticleTeaserHTML(e) {
            let rawText = e.notes || e.obj_desc || '';
            let cleanText = rawText.replace(/[#*_\-\[\]\(\)<>!]/g, '').trim();
            if (cleanText.length > 150) cleanText = cleanText.substring(0, 150) + '...';

            let previewImg = (e.photos && e.photos.length > 0) ? e.photos[0] : null;

            return `
                <article class="card" onclick="openArticle(${e.originalIndex})">
                    ${previewImg ? `
                        <div class="card-img-wrap">
                            <img src="${previewImg}" alt="${e.obj_name}" loading="lazy">
                        </div>
                    ` : ''}
                    <div class="card-body">
                        <div class="card-badges">
                            <span class="badge badge-date">${e.date || 'Unbekannt'}</span>
                            <span class="badge">Artikel</span>
                        </div>
                        <h2 class="card-title">${e.obj_name}</h2>
                        <p class="card-text">${cleanText || 'Klicke zum Lesen des Artikels...'}</p>
                        <div style="margin-top:1.2rem; color:var(--accent); font-weight:600; font-size:0.85rem;">Artikel lesen →</div>
                    </div>
                </article>
            `;
        }

        function openArticle(idx) {
            const e = siteData[idx];
            const grid = document.getElementById('article-grid');
            const reader = document.getElementById('article-reader');

            grid.style.display = 'none';
            reader.style.display = 'block';

            const rawContent = e.notes || e.obj_desc || '';
            const htmlContent = typeof marked !== 'undefined' ? marked.parse(rawContent) : rawContent;

            reader.innerHTML = `
                <button class="back-btn" onclick="renderArticles()">← Zurück zur Artikelübersicht</button>
                <article class="article-post">
                    <div class="card-badges">
                        <span class="badge badge-date">${e.date || 'Unbekannt'}</span>
                        <span class="badge">Artikel</span>
                    </div>
                    <h1>${e.obj_name}</h1>
                    <div style="margin-top: 1.5rem;">
                        ${htmlContent}
                    </div>
                </article>
            `;

            reader.querySelectorAll('img').forEach(img => {
                img.addEventListener('click', () => openLightbox(img.src));
            });

            window.scrollTo({ top: 180, behavior: 'smooth' });
        }

        function renderGallery() {
            const container = document.getElementById('gallery-grid');
            let images = [];
            
            siteData.forEach(e => { 
                if(e.photos) images.push(...e.photos); 
            });

            if (images.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted)">Keine Bilder in der Galerie.</p>';
                return;
            }
            
            const uniqueImages = [...new Set(images)];

            container.innerHTML = uniqueImages.map(src => `
                <div class="gallery-item" onclick="openLightbox('${src}')">
                    <img src="${src}" alt="Astrofoto" loading="lazy">
                </div>
            `).join('');
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        loadData();
    </script>
</body>
</html>
