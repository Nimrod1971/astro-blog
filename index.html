<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimrod1971 | Deep Sky Logbook</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #151d2a;
            --accent: #38bdf8;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2a374e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
        
        header { border-bottom: 1px solid var(--border); background: rgba(21, 29, 42, 0.8); backdrop-filter: blur(10px); sticky; top: 0; position: sticky; z-index: 100; }
        .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; }
        .logo { font-size: 1.25rem; font-weight: bold; color: var(--accent); letter-spacing: 0.5px; }
        nav button { background: none; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; margin-left: 1.5rem; cursor: pointer; transition: color 0.2s; }
        nav button.active, nav button:hover { color: var(--accent); }

        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Blog Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #0f172a; }
        .card-body { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; }
        .card-meta { font-size: 0.85rem; color: var(--accent); margin-bottom: 0.5rem; }
        .card-title { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-light); }
        .card-text { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; flex-grow: 1; }

        /* Galerie */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
        .gallery-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; aspect-ratio: 1; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .gallery-item:hover img { transform: scale(1.05); }

        /* Lightbox Overlay */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; padding: 2rem; }
        .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">✦ NIMROD1971 | ASTRO LOG</div>
            <nav>
                <button class="active" onclick="switchTab('blog')">Beobachtungen</button>
                <button onclick="switchTab('articles')">Artikel</button>
                <button onclick="switchTab('gallery')">Galerie</button>
            </nav>
        </div>
    </header>

    <main>
        <section id="blog" class="tab-content active">
            <div id="blog-grid" class="grid">Lade Beobachtungen...</div>
        </section>

        <section id="articles" class="tab-content">
            <div id="article-grid" class="grid">Keine separaten Artikel vorhanden.</div>
        </section>

        <section id="gallery" class="tab-content">
            <div id="gallery-grid" class="gallery-grid">Lade Galerie...</div>
        </section>
    </main>

    <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="" alt="Vollbild">
    </div>

    <script>
        let siteData = [];

        async function loadData() {
            try {
                const res = await fetch('data.json');
                siteData = await res.json();
                renderBlog();
                renderGallery();
            } catch (e) {
                document.getElementById('blog-grid').innerHTML = '<p>Noch keine Daten veröffentlich.</p>';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function renderBlog() {
            const container = document.getElementById('blog-grid');
            container.innerHTML = siteData.map(e => `
                <article class="card">
                    ${e.photos && e.photos.length ? `<img src="${e.photos[0]}" alt="${e.obj_name}">` : ''}
                    <div class="card-body">
                        <div class="card-meta">${e.date} • Bortle ${e.sky_quality || 'N/A'} • ${e.obj_type || 'Objekt'}</div>
                        <h2 class="card-title">${e.obj_name}</h2>
                        <p class="card-text">${e.notes || e.obj_desc || ''}</p>
                    </div>
                </article>
            `).join('');
        }

        function renderGallery() {
            const container = document.getElementById('gallery-grid');
            let images = [];
            siteData.forEach(e => { if(e.photos) images.push(...e.photos); });
            container.innerHTML = images.map(src => `
                <div class="gallery-item" onclick="openLightbox('${src}')">
                    <img src="${src}" alt="Astrofoto">
                </div>
            `).join('');
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        loadData();
    </script>
</body>
</html>
